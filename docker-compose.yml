services:
  worker:
    image: ${WORKER_IMAGE:-appt-mgmt-worker:local}
    environment:
      NODE_ENV: production
      PORT: "3003"
    ports:
      - "127.0.0.1:${WORKER_PORT:-3003}:3003"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
